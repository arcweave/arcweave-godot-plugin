name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Download Godot
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -sSLf -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/$name/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build CSharp_Plugin.csproj

      - name: Import the project
        run: timeout 300 "$GODOT" --headless --path . --import

      - name: Run the tests
        run: |
          set -o pipefail
          timeout 300 "$GODOT" --headless --path . --script res://tests/run_tests.gd 2>&1 | tee test.log
          # A script error outside a test assertion, eg. in the runner, fails the run too
          if grep -q "SCRIPT ERROR" test.log; then
            echo "::error::The tests logged script errors"
            exit 1
          fi
